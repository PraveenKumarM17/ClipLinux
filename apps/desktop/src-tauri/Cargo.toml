[package]
name = "clipl-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ClipLinux desktop application (Tauri v2 + Svelte 5)"
publish.workspace = true

[[bin]]
name = "clipl-desktop"
path = "src/main.rs"

[lib]
name = "clipl_desktop_lib"
path = "src/lib.rs"

[features]
default = []
# Production WebView. Requires WebKitGTK on Linux; excluded from default
# `cargo test --workspace` so core crates stay buildable without a display stack.
tauri-app = ["dep:tauri", "dep:tauri-build", "dep:arboard"]

[dependencies]
clipl-core.workspace = true
clipl-protocol.workspace = true
serde.workspace = true
tauri = { version = "2", optional = true, features = [] }
arboard = { version = "3", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
