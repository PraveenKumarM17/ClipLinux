[workspace]
resolver = "2"
members = [
    "crates/clipl-core",
    "crates/clipl-clipboard",
    "crates/clipl-emoji",
    "crates/clipl-media",
    "crates/clipl-snippets",
    "crates/clipl-symbols",
    "crates/clipl-privacy",
    "crates/clipl-platform",
    "crates/clipl-protocol",
    "apps/cli",
    "apps/daemon",
    "apps/desktop/src-tauri",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
authors = ["ClipLinux Contributors"]
homepage = "https://github.com/PraveenKumarM17/ClipLinux"
repository = "https://github.com/PraveenKumarM17/ClipLinux"
description = "Universal paste, clipboard, and expression platform for Linux"
publish = false

[workspace.dependencies]
clipl-core = { path = "crates/clipl-core" }
clipl-clipboard = { path = "crates/clipl-clipboard" }
clipl-emoji = { path = "crates/clipl-emoji" }
clipl-media = { path = "crates/clipl-media" }
clipl-snippets = { path = "crates/clipl-snippets" }
clipl-symbols = { path = "crates/clipl-symbols" }
clipl-privacy = { path = "crates/clipl-privacy" }
clipl-platform = { path = "crates/clipl-platform" }
clipl-protocol = { path = "crates/clipl-protocol" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = "3"
tempfile = "3"
x11rb = { version = "0.13", features = ["xfixes", "xtest"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
