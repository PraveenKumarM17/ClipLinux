[workspace]
resolver = "2"
members = [
    "crates/unipick-core",
    "crates/unipick-clipboard",
    "crates/unipick-emoji",
    "crates/unipick-media",
    "crates/unipick-snippets",
    "crates/unipick-symbols",
    "crates/unipick-privacy",
    "crates/unipick-platform",
    "crates/unipick-protocol",
    "apps/cli",
    "apps/daemon",
    "apps/desktop/src-tauri",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
authors = ["UniPick Contributors"]
homepage = "https://github.com/unipick/unipick"
repository = "https://github.com/unipick/unipick"
description = "Universal paste, clipboard, and expression platform for Linux"
publish = false

[workspace.dependencies]
unipick-core = { path = "crates/unipick-core" }
unipick-clipboard = { path = "crates/unipick-clipboard" }
unipick-emoji = { path = "crates/unipick-emoji" }
unipick-media = { path = "crates/unipick-media" }
unipick-snippets = { path = "crates/unipick-snippets" }
unipick-symbols = { path = "crates/unipick-symbols" }
unipick-privacy = { path = "crates/unipick-privacy" }
unipick-platform = { path = "crates/unipick-platform" }
unipick-protocol = { path = "crates/unipick-protocol" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
