name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            file \
            wget \
            patchelf \
            rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Quality gates
        run: bash scripts/check.sh

      - name: Frontend checks
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
          npm run check

      - name: Build Linux bundles
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Packaged ClipLinux for Linux.

            **Supported**
            - GNOME (Wayland) with the ClipLinux Shell extension — log out after install so Shell loads it
            - Any desktop on X11 (clipboard watch + native shortcut)

            **Not in this package**
            - KDE / Sway / Hyprland clipboard watch and restore-focus insert
            - A universal Wayland global hotkey

            After `.deb` / `.rpm` install, the daemon and picker autostart on login.
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
